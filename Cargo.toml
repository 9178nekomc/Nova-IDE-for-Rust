[package]
name = "novars"
version = "0.1.0"
edition = "2021"
description = "NovaRS - Nova IDE for Rust, a native Rust IDE built with egui + eframe"

[build-dependencies]
winresource = "0.1"

[dependencies]
egui = "0.29"
eframe = "0.29"
walkdir = "2"
rfd = "0.14"
syn = { version = "2.0", features = ["full", "extra-traits"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# 直接依赖 syn 的底层解析器，开启 span-locations 以获得 AST 节点的精确行号
proc-macro2 = { version = "1.0", features = ["span-locations"] }
# 帧导出诊断功能使用（PNG 编码）；eframe 已传递依赖同版本 crate
image = { version = "0.25", default-features = false, features = ["png"] }
